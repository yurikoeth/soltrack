[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]
# `cargo test` at the root runs the pure crates; src-tauri needs the built
# frontend (`npm run build`) before it compiles, so it is opted into explicitly.
default-members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
decode = { path = "crates/decode" }
store = { path = "crates/store" }
pnl = { path = "crates/pnl" }
ingest = { path = "crates/ingest" }
sim = { path = "crates/sim" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
bs58 = "0.5"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
async-trait = "0.1"
toml = "0.8"
toml_edit = "0.22"
curve25519-dalek = "4"
base64 = "0.22"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
